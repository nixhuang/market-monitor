name: 早间自动结果保险
run-name: "自动结果保险 · ${{ github.event_name }}"

# GitHub 的 schedule 触发只是尽力而为，高负载时可能延迟或丢弃。
# 这里在主定时任务之后再检查一次：当晚收盘结果还没生成，才补派发一次；已有结果或已有任务在跑则什么都不做。
on:
  schedule:
    # 同样改用普通 UTC cron（美东周一~周五晚 = UTC 周二~周六）：
    # 00:45 / 01:45 UTC 分别是夏令时、冬令时的美东 20:45（落在 20:00-21:00 休盘窗口内，晚于主任务 30 分钟）。
    # 不对的那个时点（美东不在 20:00-21:00）monitor.py 会直接退出，什么都不做。
    - cron: '45 0 * * 2-6'
    - cron: '45 1 * * 2-6'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests exchange-calendars

      - name: 检查并按需补跑
        run: python monitor.py --ensure-schedule-run
