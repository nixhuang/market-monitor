name: 早间自动结果保险
run-name: "自动结果保险 · ${{ github.event_name }}"

# 唯一入口：Cloudflare Worker（cloudflare/market-monitor-trigger.js）在美东 20:15 / 20:45 各派发一次。
# monitor.py --ensure-schedule-run 判断：不在美东 20:00–21:00 → 不做；当晚结果已存在且当日日线齐 → 不做；
# 主任务正在排队/运行 → 不做；否则派发 daily.yml（source=schedule-fallback，按定时口径跑）。
# GitHub 自带 schedule 已删除（实测每次迟到 4–6 小时，全被窗口挡掉）。
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 检查并按需补跑
        run: python monitor.py --ensure-schedule-run
