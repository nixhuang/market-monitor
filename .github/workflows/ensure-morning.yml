name: 早间自动结果保险
run-name: "自动结果保险 · ${{ github.event_name }}"

# 唯一入口：Cloudflare Worker（cloudflare/market-monitor-trigger.js）在美东 20:30 / 20:45 各派发一次。
# 当日日线未就绪时，daily.yml 会再派发本工作流（delay_minutes=30）做延迟重试，最晚到美东 24 点。
# monitor.py --ensure-schedule-run 判断：不在美东 20:00–24:00 → 不做；当晚结果已存在且当日日线齐 → 不做；
# 主任务正在排队/运行 → 不做；否则派发 daily.yml（source=schedule-fallback，按定时口径跑）。
# GitHub 自带 schedule 已删除（实测每次迟到 4–6 小时，全被窗口挡掉）。
on:
  workflow_dispatch:
    inputs:
      delay_minutes:
        description: '内部使用：延迟重试固定等待30分钟'
        required: false
        type: string
      retry_attempt:
        description: '内部使用：自动重试轮数，0–7'
        required: false
        type: string
      retry_day:
        description: '内部使用：保险链的美东日期，不允许跨日续跑'
        required: false
        type: string

# 串行覆盖等待、检查和派发，避免 Worker 与延迟重试同时看到“无在途任务”。
# 不复用 daily 的锁，防止父任务等待补跑时互相阻塞。
concurrency:
  group: market-monitor-ensure
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 延迟重试等待
        if: ${{ inputs.delay_minutes != '' }}
        env:
          DELAY: ${{ inputs.delay_minutes }}
        run: |
          if [ "$DELAY" != 30 ]; then echo "延迟重试只接受30分钟"; exit 1; fi
          echo "等待 ${DELAY} 分钟后再检查当日日线"
          sleep $((DELAY * 60))

      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          # 等待期间 main 可能已更新，不能读取触发本工作流时的旧 SHA。
          ref: main

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 验证同日窗口与重试轮数
        id: retry-context
        env:
          MM_RETRY_ATTEMPT: ${{ inputs.retry_attempt }}
          MM_RETRY_DAY: ${{ inputs.retry_day }}
          MM_RETRY_DELAY: ${{ inputs.delay_minutes }}
        run: python build_support.py retry-context >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        if: ${{ steps.retry-context.outputs.allowed == 'true' }}
        run: python -m pip install -r requirements.txt

      - name: 检查并按需补跑
        if: ${{ steps.retry-context.outputs.allowed == 'true' }}
        env:
          MM_RETRY_ATTEMPT: ${{ steps.retry-context.outputs.retry_attempt }}
          MM_RETRY_DAY: ${{ steps.retry-context.outputs.retry_day }}
        run: python monitor.py --ensure-schedule-run
