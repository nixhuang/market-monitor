name: 数据源探针

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测各数据源
        run: |
          probe() {
            echo "===== $1"
            curl -sS -o /tmp/out -w "http=%{http_code} 耗时=%{time_total}s 大小=%{size_download}\n" \
              --max-time 90 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$2" || echo "curl 退出码=$?"
            head -c 180 /tmp/out; echo; echo
          }
          probe "FRED CSV（90秒超时，看是慢还是封）" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=BAMLH0A0HYM2"
          probe "FRED 官方 API（故意用错误 key，看域名通不通）" "https://api.stlouisfed.org/fred/series?series_id=BAMLH0A0HYM2&api_key=INVALID_KEY_TEST&file_type=json"
          probe "Yahoo 指数 ^TNX（对照）" "https://query1.finance.yahoo.com/v8/finance/chart/%5ETNX?range=5d&interval=1d"
          probe "Nasdaq API（对照）" "https://api.nasdaq.com/api/quote/UNH/historical?assetclass=stocks&fromdate=2026-08-01&todate=2026-10-05&limit=60"
          probe "CBOE VIX" "https://cdn.cboe.com/api/global/delayed_quotes/quotes/_VIX.json"
