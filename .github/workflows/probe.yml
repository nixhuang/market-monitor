name: 数据源探针

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测各数据源
        run: |
          set +e
          probe() {
            echo "===== $1"
            curl -sS -o /tmp/out -w "http=%{http_code} 耗时=%{time_total}s 大小=%{size_download}\n" \
              --max-time 60 $3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$2"
            echo "退出码=$?"
            head -c 160 /tmp/out 2>/dev/null; echo; echo
          }
          probe "FRED CSV + 强制 HTTP/1.1" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=BAMLH0A0HYM2" "--http1.1"
          probe "FRED CSV + HTTP/1.1 + IPv4" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=BAMLH0A0HYM2" "--http1.1 -4"
          probe "FRED CSV 默认(HTTP/2)" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=BAMLH0A0HYM2" ""
          probe "FRED 官方 API(错key,看域名通不通)" "https://api.stlouisfed.org/fred/series?series_id=BAMLH0A0HYM2&api_key=INVALID&file_type=json" "--http1.1"
          probe "Yahoo ^TNX" "https://query1.finance.yahoo.com/v8/finance/chart/%5ETNX?range=5d&interval=1d" "--http1.1"
          probe "Nasdaq API" "https://api.nasdaq.com/api/quote/UNH/historical?assetclass=stocks&fromdate=2026-08-01&todate=2026-10-05&limit=60" "--http1.1"
          probe "CBOE VIX" "https://cdn.cboe.com/api/global/delayed_quotes/quotes/_VIX.json" "-L"
          echo "ALL DONE"
