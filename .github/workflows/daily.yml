name: 每日市场自检
run-name: "市场自检 · ${{ github.event_name }} · ${{ inputs.request_id || github.sha }}"

on:
  # 与 build_support.BUILD_INPUT_PATTERNS / EXCLUDED_INPUTS 对齐。
  # 根目录新增生产模块和资源自动触发；只改 tests/ 不触发发布。
  push:
    branches: [main]
    paths:
      - '*.py'
      - '*.js'
      - '*.mjs'
      - '*.css'
      - '*.html'
      - '*.json'
      - '*.webmanifest'
      - '*.svg'
      - '*.png'
      - '*.ico'
      - '*.jpg'
      - '*.jpeg'
      - '*.webp'
      - '*.woff'
      - '*.woff2'
      - '*.toml'
      - '*.yaml'
      - '*.yml'
      - 'requirements*.txt'
      - 'requirements*.lock'
      - 'uv.lock'
      - 'poetry.lock'
      - 'assets/**'
      - 'static/**'
      - 'templates/**'
      - 'icons/**'
      - 'config/**'
      - '.github/workflows/daily.yml'
      - '.github/workflows/ensure-morning.yml'
      - '!index.html'
      - '!status.json'
      - '!run-receipt.json'
      - '!position-costs.json'
      - '!import-audit.json'
  # 定时仍仅由 Worker 在美东 20:15 / 20:45 派发 ensure-morning.yml。
  # 首轮由 Worker 派发；缺数后在 20:00–24:00 窗口内延迟重试，不增加 GitHub schedule。
  workflow_dispatch:
    inputs:
      request_id:
        description: '网页运行回执标识（可留空）'
        required: false
        type: string
      source:
        description: '内部使用：schedule-fallback = 定时任务缺失时的自动补跑（按定时任务口径运行）'
        required: false
        type: string
      retry_attempt:
        description: '内部使用：自动重试轮数，0–7'
        required: false
        type: string
      retry_day:
        description: '内部使用：本轮保险链的美东日期，不允许跨日续跑'
        required: false
        type: string

concurrency:
  group: market-monitor
  cancel-in-progress: false

permissions:
  actions: write   # 当日日线未就绪时要派发 ensure-morning.yml 做延迟重试
  contents: write

jobs:
  # 复用离线矩阵；测试不过，不生成或发布。
  test:
    uses: ./.github/workflows/tests.yml
    with:
      called_by_daily: true

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MM_EVENT: ${{ inputs.source == 'schedule-fallback' && 'schedule' || github.event_name }}
      MM_REQUEST_ID: ${{ inputs.request_id }}
      MM_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      MM_RETRY_ATTEMPT: ${{ inputs.retry_attempt }}
      MM_RETRY_DAY: ${{ inputs.retry_day }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 冻结构建输入
        id: inputs
        run: |
          set -euo pipefail
          python build_support.py snapshot --snapshot "$RUNNER_TEMP/build-inputs.json" >> "$GITHUB_ENV"
          # 固定校验器副本，重试 reset 后仍使用本轮规则；helper 自身也属于输入。
          cp build_support.py "$RUNNER_TEMP/build_support.py"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 恢复辅助缓存
        uses: actions/cache/restore@v4
        with:
          path: .cache/market-monitor.json
          key: market-monitor-v1-${{ runner.os }}-py311-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-monitor-v1-${{ runner.os }}-py311-

      - name: 检查自动重试上下文
        id: retry-context
        if: ${{ env.MM_EVENT == 'schedule' }}
        run: python "$RUNNER_TEMP/build_support.py" retry-context >> "$GITHUB_OUTPUT"

      - name: 锁定本次目标交易日
        id: prepare
        if: ${{ env.MM_EVENT != 'schedule' || steps.retry-context.outputs.allowed == 'true' }}
        run: python monitor.py --prepare-run >> "$GITHUB_ENV"

      - name: 抓数据并生成页面
        id: gen
        if: ${{ steps.prepare.outcome == 'success' }}
        # publish=no 不提交页面，但成功写入的辅助缓存仍保存。
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python monitor.py

      - name: 验证本轮辅助缓存凭证
        id: cache-proof
        if: ${{ always() && steps.gen.outputs.cache_ready == 'true' }}
        env:
          CACHE_CHECKPOINT_ID: ${{ steps.gen.outputs.cache_checkpoint_id }}
        run: |
          python runtime_state.py verify-cache --checkpoint-id "$CACHE_CHECKPOINT_ID"

      - name: 保存成功辅助缓存
        id: cache-save
        if: ${{ always() && steps.cache-proof.outcome == 'success' && hashFiles('.cache/market-monitor.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/market-monitor.json
          key: market-monitor-v1-${{ runner.os }}-py311-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 上传运行回执与输入快照
        id: receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-receipt.json
            ${{ runner.temp }}/build-inputs.json
          if-no-files-found: warn

      - name: 封存本轮产物
        id: seal
        if: ${{ steps.gen.outcome == 'success' && steps.gen.outputs.publish != 'no' }}
        run: |
          python "$RUNNER_TEMP/build_support.py" seal \
            --snapshot "$RUNNER_TEMP/build-inputs.json" --bundle-dir "$RUNNER_TEMP/build-artifacts"

      - name: 校验最新输入并提交更新
        id: commit
        if: ${{ steps.gen.outcome == 'success' && steps.gen.outputs.publish != 'no' }}
        # 仅无关更新允许复用本轮产物。输入改变或校验失败即退出，绝不贴新 SHA。
        run: |
          set -euo pipefail
          # 只有终端 fetch/push 网络诊断能改成 network；证明、配置、权限错误默认禁止续链。
          echo "retry_reason=blocked" >> "$GITHUB_OUTPUT"
          export LC_ALL=C GIT_TERMINAL_PROMPT=0
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          reason=blocked
          for i in 1 2 3 4 5; do
            if error=$(git fetch origin main 2>&1); then
              printf '%s\n' "$error"
            else
              code=$?
              printf '%s\n' "$error"
              reason=$(printf '%s' "$error" | python "$RUNNER_TEMP/build_support.py" git-failure --operation fetch --returncode "$code")
              if [ "$reason" != network ]; then exit 1; fi
              continue
            fi
            target=$(git rev-parse --verify origin/main)
            python "$RUNNER_TEMP/build_support.py" verify \
              --snapshot "$RUNNER_TEMP/build-inputs.json" --ref "$target"
            state=$(python "$RUNNER_TEMP/build_support.py" artifact-state \
              --snapshot "$RUNNER_TEMP/build-inputs.json" \
              --bundle-dir "$RUNNER_TEMP/build-artifacts" --ref "$target")
            if [ "$state" = 'no-change' ]; then
              echo "无变化，跳过提交"
              echo "result=no-change" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" != 'changed' ]; then
              echo "未知产物状态，拒绝发布"
              exit 1
            fi
            # target 是刚验证的不可变提交；后续 main 再变化时 push 会拒绝并重新校验。
            git reset --hard "$target"
            cp "$RUNNER_TEMP/build-artifacts/index.html" "$RUNNER_TEMP/build-artifacts/status.json" .
            git add -- index.html status.json
            git commit -m "更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            if error=$(git push origin HEAD:main 2>&1); then
              printf '%s\n' "$error"
              echo "result=committed" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            else
              code=$?
              printf '%s\n' "$error"
              reason=$(printf '%s' "$error" | python "$RUNNER_TEMP/build_support.py" git-failure --operation push --returncode "$code")
              case "$reason" in network|race) ;; *) exit 1 ;; esac
            fi
            echo "推送失败，第 $i/5 次；下次重试重新检查最新 main 的完整输入集合"
          done
          if [ "$reason" = network ]; then echo "retry_reason=network" >> "$GITHUB_OUTPUT"; fi
          echo "连续5次传输或推送失败，未确认提交，请查看 git 错误信息"
          exit 1

      - name: 判断是否允许延迟重试
        id: retry-plan
        if: ${{ always() && !cancelled() && env.MM_EVENT == 'schedule' && steps.inputs.outcome == 'success' }}
        env:
          MM_TEST_RESULT: ${{ needs.test.result }}
          MM_STEP_RESULTS: ${{ toJSON(steps) }}
          MM_RETRY_ATTEMPT: ${{ steps.retry-context.outputs.retry_attempt }}
          MM_RETRY_DAY: ${{ steps.retry-context.outputs.retry_day }}
        run: python "$RUNNER_TEMP/build_support.py" retry-plan >> "$GITHUB_OUTPUT"

      - name: 可恢复失败或缺数：30 分钟后同日有界重试
        if: ${{ always() && !cancelled() && steps.retry-plan.outputs.allowed == 'true' }}
        env:
          RETRY_ATTEMPT: ${{ steps.retry-plan.outputs.retry_attempt }}
          RETRY_DAY: ${{ steps.retry-plan.outputs.retry_day }}
        run: |
          gh workflow run ensure-morning.yml --ref main -R "$GITHUB_REPOSITORY" \
            -f delay_minutes=30 -f retry_attempt="$RETRY_ATTEMPT" -f retry_day="$RETRY_DAY"
