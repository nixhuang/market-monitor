name: 每日市场自检

on:
  # 改了清单或脚本就立刻重跑，不用再去点 Run workflow
  # 只监听这三个文件：workflow 自己提交 index.html 不会触发，避免空转
  push:
    branches: [main]
    paths:
      - 'holdings.json'
      - 'settings.json'
      - 'monitor.py'
      - '.github/workflows/daily.yml'
  # UTC 12:00 = 北京时间 20:00（美股开盘前约 1.5 小时）
  # Actions 可能延迟，所以提前留足缓冲
  schedule:
    - cron: '0 12 * * *'
    # 周日额外跑一次（UTC 13:00 = 北京 21:00）
    - cron: '0 13 * * 0'
  # 允许在网页上手动点一下立刻跑
  workflow_dispatch:

# 同时只允许一个任务在跑，后来的排队，避免互相覆盖
concurrency:
  group: market-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      # cron 是 UTC 时间，写死的 '0 12' 在北京永远是 20:00，
      # 但美股用夏令时（UTC-4）时是美东 08:00、冬令时（UTC-5）变成 07:00。
      # 这里补一小时，让全年都稳定在「美东 08:00 = 开盘前 1.5 小时」这个时点。
      - name: 冬夏令时校正
        run: |
          H=$((10#$(TZ=America/New_York date +%H)))
          echo "现在美东: $(TZ=America/New_York date)  (hour=$H)"
          if [ "$H" -lt 8 ]; then
            echo "冬令时，等到美东 08:00 再抓数据"
            sleep 3600
            echo "开跑: $(TZ=America/New_York date)"
          fi

      - name: 抓数据并生成页面
        # FRED_API_KEY 是可选 Secret：配置了才能拿到跑路价签和收益率曲线
        # （Actions 访问 fred.stlouisfed.org 的 CSV 接口会被 CDN 掐断，只有官方 API 域名通）
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 微信推送（Server酱）：没配就只生成页面、不推送
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python monitor.py

      - name: 提交更新
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
