name: 每日市场自检
run-name: "市场自检 · ${{ github.event_name }} · ${{ inputs.request_id || github.sha }}"

on:
  # 改了清单或脚本就立刻重跑，不用再去点 Run workflow
  # 只监听这几个文件：workflow 自己提交 index.html 不会触发，避免空转
  push:
    branches: [main]
    paths:
      - 'holdings.json'
      - 'settings.json'
      - 'monitor.py'
      - 'groups.json'
      - '.github/workflows/daily.yml'
  schedule:
    # 美东周一至周五20:30：夏令时北京次日08:30，冬令时次日09:30。
    # GitHub原生IANA时区负责冬夏切换，不需要睡一小时或每年手动改。
    - cron: '30 20 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      request_id:
        description: '网页运行回执标识（可留空）'
        required: false
        type: string

# 同时只允许一个任务在跑，后来的排队，避免互相覆盖
concurrency:
  group: market-monitor
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MM_EVENT: ${{ github.event_name }}
      MM_REQUEST_ID: ${{ inputs.request_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests exchange-calendars

      - name: 锁定本次目标交易日
        run: |
          python monitor.py --prepare-run >> "$GITHUB_ENV"

      - name: 抓数据并生成页面
        # FRED_API_KEY 是可选 Secret：配置了才能拿到跑路价签和收益率曲线
        # （Actions 访问 fred.stlouisfed.org 的 CSV 接口会被 CDN 掐断，只有官方 API 域名通）
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 微信推送（Server酱）：没配就只生成页面、不推送
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python monitor.py

      - name: 提交更新
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html status.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
