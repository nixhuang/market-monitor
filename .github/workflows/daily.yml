name: 每日市场自检
run-name: "市场自检 · ${{ github.event_name }} · ${{ inputs.request_id || github.sha }}"

on:
  # 改了清单或脚本就立刻重跑，不用再去点 Run workflow
  # 只监听这几个文件：workflow 自己提交 index.html 不会触发，避免空转
  push:
    branches: [main]
    paths:
      - 'holdings.json'
      - 'settings.json'
      - 'monitor.py'
      - 'policy_alerts.py'
      - 'earnings_sources.py'
      - 'official-earnings.json'
      - 'groups.json'
      - 'cost_panel.css'
      - 'cost_panel.js'
      - 'position-costs.seed.json'    # 持仓数量/现金/固定收益的种子：改了要重跑才会注入新页面
      - '.github/workflows/daily.yml'
  # 不再使用 GitHub 自带的 schedule：实测每次都迟到 4–6 小时，到了也落在美东 20:00–21:00 窗口外被挡掉，白跑。
  # 定时改由 Cloudflare Worker（cloudflare/market-monitor-trigger.js）在美东 20:15 / 20:45 派发 ensure-morning.yml，
  # 由它判断要不要派发本工作流（source=schedule-fallback，按定时口径跑）。
  workflow_dispatch:
    inputs:
      request_id:
        description: '网页运行回执标识（可留空）'
        required: false
        type: string
      source:
        description: '内部使用：schedule-fallback = 定时任务缺失时的自动补跑（按定时任务口径运行）'
        required: false
        type: string

# 同时只允许一个任务在跑，后来的排队，避免互相覆盖
concurrency:
  group: market-monitor
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  # 发布前自检：九项离线测试（tests.yml，不联网、不读线上设置）。
  # 不通过 → build 不会运行 → 不抓数据、不生成页面、不发布，页面保持上一次的内容，Actions 里这一轮显示红叉。
  # （原来的 gate 任务只拦 GitHub 原生 schedule，schedule 删掉后一并删除；时间窗口由 ensure_schedule_run 把关。）
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 自动补跑按 schedule 口径（收盘数据、目标交易日锚定美东20:00），页面显示为"自动"
      MM_EVENT: ${{ inputs.source == 'schedule-fallback' && 'schedule' || github.event_name }}
      MM_REQUEST_ID: ${{ inputs.request_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests exchange-calendars

      - name: 锁定本次目标交易日
        run: |
          python monitor.py --prepare-run >> "$GITHUB_ENV"

      - name: 抓数据并生成页面
        id: gen
        # FRED_API_KEY 是可选 Secret：配置了才能拿到跑路价签和收益率曲线
        # （Actions 访问 fred.stlouisfed.org 的 CSV 接口会被 CDN 掐断，只有官方 API 域名通）
        # 定时口径下当日日线不齐时 monitor.py 不写页面并输出 publish=no，下一步整步跳过（绝不能拿旧文件去覆盖 main）。
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 微信推送（Server酱）：没配就只生成页面、不推送
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python monitor.py

      - name: 提交更新
        if: steps.gen.outputs.publish != 'no'
        # 抓取要几分钟，期间你保存的清单/设置可能已先推送到 main，直接 git push 会被拒绝，
        # 白白丢掉整轮结果。这里每次先同步最新 main，再把本轮生成的两个文件放上去重试。
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/out"
          cp index.html status.json "$RUNNER_TEMP/out/"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/out/index.html" "$RUNNER_TEMP/out/status.json" .
            git add index.html status.json
            if git diff --staged --quiet; then
              echo "无变化，跳过提交"
              exit 0
            fi
            git commit -m "更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "推送被拒绝（运行期间 main 有新提交），第 $i/5 次重新同步后重试"
            sleep $((i * 3))
          done
          echo "连续5次推送失败，请查看上面的 git 错误信息"
          exit 1
