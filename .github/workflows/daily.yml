name: 每日市场自检
run-name: "市场自检 · ${{ github.event_name }} · ${{ inputs.request_id || github.sha }}"

on:
  # 改了清单或脚本就立刻重跑，不用再去点 Run workflow
  # 只监听这几个文件：workflow 自己提交 index.html 不会触发，避免空转
  push:
    branches: [main]
    paths:
      - 'holdings.json'
      - 'settings.json'
      - 'monitor.py'
      - 'groups.json'
      - '.github/workflows/daily.yml'
  schedule:
    # 目标：美东周一至周五 20:15（落在纳斯达克 23/5 交易的 20:00–21:00 休盘窗口内）= 夏令时北京次日 08:15 / 冬令时北京次日 09:15。
    # 不用 GitHub 的 timezone 写法（实测定时触发时间对不上），改用普通 UTC cron，夏冬令时各排一个时点：
    #   夏令时(EDT) 美东 20:15 = 00:15 UTC；冬令时(EST) 美东 20:15 = 01:15 UTC。
    # 两个时点每天都会触发，由下面的 gate 任务按美东当地时间只放行对的那一个。
    # 美东周一~周五晚 = UTC 周二~周六，所以星期写 2-6。
    - cron: '15 0 * * 2-6'
    - cron: '15 1 * * 2-6'
  workflow_dispatch:
    inputs:
      request_id:
        description: '网页运行回执标识（可留空）'
        required: false
        type: string
      source:
        description: '内部使用：schedule-fallback = 定时任务缺失时的自动补跑（按定时任务口径运行）'
        required: false
        type: string

# 同时只允许一个任务在跑，后来的排队，避免互相覆盖
concurrency:
  group: market-monitor
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  gate:
    # 只对定时触发做判断：美东当地时间在 20:00–21:00（休盘窗口）之间才放行，其余时点（夏冬令时里不对的那一个、或被拖过 21:00）直接跳过。
    # 手动运行、保存清单触发、自动补跑都不受影响。
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          hm=$(TZ=America/New_York date +%H%M)
          m=$(( 10#${hm:0:2} * 60 + 10#${hm:2:2} ))
          echo "美东当地时间 ${hm:0:2}:${hm:2:2}（分钟数 $m）"
          if [ "$m" -ge 1200 ] && [ "$m" -lt 1260 ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "不在美东 20:00–21:00 休盘窗口，本次是冬夏令时里不对的那个时点（或被拖过 21:00），跳过"
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi

  # 发布前自检：八项离线测试（tests.yml，不联网、不读线上设置）。
  # 不通过 → build 不会运行 → 不抓数据、不生成页面、不发布，页面保持上一次的内容，Actions 里这一轮显示红叉。
  test:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    uses: ./.github/workflows/tests.yml

  build:
    needs: [gate, test]
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 自动补跑按 schedule 口径（收盘数据、目标交易日锚定美东20:00），页面显示为"自动"
      MM_EVENT: ${{ inputs.source == 'schedule-fallback' && 'schedule' || github.event_name }}
      MM_REQUEST_ID: ${{ inputs.request_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests exchange-calendars

      - name: 锁定本次目标交易日
        run: |
          python monitor.py --prepare-run >> "$GITHUB_ENV"

      - name: 抓数据并生成页面
        # FRED_API_KEY 是可选 Secret：配置了才能拿到跑路价签和收益率曲线
        # （Actions 访问 fred.stlouisfed.org 的 CSV 接口会被 CDN 掐断，只有官方 API 域名通）
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 微信推送（Server酱）：没配就只生成页面、不推送
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python monitor.py

      - name: 提交更新
        # 抓取要几分钟，期间你保存的清单/设置可能已先推送到 main，直接 git push 会被拒绝，
        # 白白丢掉整轮结果。这里每次先同步最新 main，再把本轮生成的两个文件放上去重试。
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/out"
          cp index.html status.json "$RUNNER_TEMP/out/"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/out/index.html" "$RUNNER_TEMP/out/status.json" .
            git add index.html status.json
            if git diff --staged --quiet; then
              echo "无变化，跳过提交"
              exit 0
            fi
            git commit -m "更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "推送被拒绝（运行期间 main 有新提交），第 $i/5 次重新同步后重试"
            sleep $((i * 3))
          done
          echo "连续5次推送失败，请查看上面的 git 错误信息"
          exit 1
