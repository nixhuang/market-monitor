name: 每日市场自检

on:
  # 改了清单或脚本就立刻重跑，不用再去点 Run workflow
  # 只监听这几个文件：workflow 自己提交 index.html 不会触发，避免空转
  push:
    branches: [main]
    paths:
      - 'holdings.json'
      - 'settings.json'
      - 'monitor.py'
      - '.github/workflows/daily.yml'
  schedule:
    # ① 开盘前：美东 08:00，看昨收数据做当天计划
    #    夏令时 = 北京 20:00 / 冬令时 = 北京 21:00
    - cron: '0 12 * * *'
    # ② 收盘后 1 小时：美东 17:00，看当日完整 K 线（布林/RSI 才是定稿值）
    #    夏令时 = 北京次日 05:00 / 冬令时 = 北京次日 06:00
    #    周末没有交易，只跑周一到周五（UTC 星期几）
    - cron: '0 21 * * 1-5'
  # 允许在网页上手动点一下立刻跑
  workflow_dispatch:

# 同时只允许一个任务在跑，后来的排队，避免互相覆盖
concurrency:
  group: market-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      # cron 是 UTC 时间，而美股看的是美东时间：
      #   夏令时 UTC-4：'0 12' → 美东 08:00，'0 21' → 美东 17:00
      #   冬令时 UTC-5：'0 12' → 美东 07:00，'0 21' → 美东 16:00（都早了一小时）
      # 所以冬令时补睡 1 小时，让两次任务全年都落在美东 08:00 和 17:00。
      - name: 冬夏令时校正
        run: |
          H=$((10#$(TZ=America/New_York date +%H)))
          echo "现在美东: $(TZ=America/New_York date)  (hour=$H)"
          case "$H" in
            7)  echo "冬令时 → 等到美东 08:00（开盘前 1.5 小时）"; sleep 3600 ;;
            16) echo "冬令时 → 等到美东 17:00（收盘后 1 小时）";   sleep 3600 ;;
          esac
          echo "开跑: $(TZ=America/New_York date)"

      - name: 抓数据并生成页面
        # FRED_API_KEY 是可选 Secret：配置了才能拿到跑路价签和收益率曲线
        # （Actions 访问 fred.stlouisfed.org 的 CSV 接口会被 CDN 掐断，只有官方 API 域名通）
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 微信推送（Server酱）：没配就只生成页面、不推送
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python monitor.py

      - name: 提交更新
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
