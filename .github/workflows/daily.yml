name: 每日市场自检

on:
  # UTC 12:00 = 北京时间 20:00（美股开盘前约 1.5 小时）
  # Actions 可能延迟，所以提前留足缓冲
  schedule:
    - cron: '0 12 * * *'
    # 周日额外跑一次（UTC 13:00 = 北京 21:00）
    - cron: '0 13 * * 0'
  # 允许在网页上手动点一下立刻跑
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests

      - name: 抓数据并生成页面
        run: python monitor.py

      - name: 提交更新
        run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
