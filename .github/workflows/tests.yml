name: 自动测试
run-name: "自动测试 · ${{ github.event_name }}"

# 生产文件的 main push 由 daily 调用本矩阵，不再重复启动独立测试工作流。
# tests-only 变更仍自动跑，但不会触发 daily；PR 和手动测试入口保留。
on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths-ignore:
      - 'index.html'
      - 'status.json'
      - 'run-receipt.json'
      - 'position-costs.json'
      - 'import-audit.json'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 跑全部离线测试
        run: python tests/run_all.py
